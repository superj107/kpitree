    tr.tabIndex=0;tr.onclick=tr.onkeydown=e=>{if(e.type==="keydown"&&e.key!=="Enter")return;sel=sel===r.g?0:r.g;render()};tb.appendChild(tr)});
  const tr=document.getElementById("trees");
  if(sel){const p=D.filter(d=>d[gi]===sel);const c={};p.forEach(d=>c[d[1]]=(c[d[1]]||0)+1);
    tr.innerHTML=`<h2>第 ${sel} 組樹種清單（${p.length} 棵）</h2><p>${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+" "+v).join("、")}</p>`}
  else tr.innerHTML="<p>點選表格中的組別，可在圖上單獨顯示該組並列出樹種。網址後面加上 #g1～#g9 可直接打開某一組。</p>";
}
svg.addEventListener("click",e=>{const m=svg.getScreenCTM();if(!m)return;const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());
  let best=null,bd=16*16;D.forEach(d=>{const dd=(d[4]-p.x)**2+(d[5]-p.y)**2;if(dd<bd){bd=dd;best=d}});
  if(best){pick=best[0];draw();showCard()}});
function render(){document.getElementById("note").textContent=NOTE[plan];draw();table();showCard()}
